<!DOCTYPE html>
<html lang="pt-br">
<head>
   
    <meta charset="UTF-8">

    <title>Periquito</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

    <body>

            <div class="container-login">
                
                <img src="Imagens/periquito_img1.png" class="logo-login" alt="">
            
                <form id="dados-login"> 
            
                <label for="login">Nome de acesso: </label>
                <input type="text" class="campo-amarelo" name="login" id="login" required>
            
                <label for="senha">Senha: </label>
                <input type="password" class="campo-amarelo" name="Senha" id="Senha" required>
                
                <label>Perfil: </label>
                <select> 
                    <option> Aluno </option>
                    <option> Professor </option>
                    <option> Administrador </option>
                </select>

                <input class="btn-entrar" type="submit" value="Entrar">

            </form>
            </div>
