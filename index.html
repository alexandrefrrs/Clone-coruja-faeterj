<!DOCTYPE html>
<html lang="pt-br">
<head>
   
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psita</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

    <body class="login-body">

            <div class="login-container">
                
                <img src="Imagens/logo1.png" class="login-logo" alt="">
            
                <form class="login-form" id="dados-login"> 
            
                <label class="login-label" for="login">Nome de acesso: </label>
                <input class="login-input campo-amarelo" type="text" name="login" id="login">
                <span id="erro-login" class="login-span"> </span>
            
                <label class="login-label" for="senha">Senha: </label>
                <input class="login-input campo-amarelo" type="password"  name="Senha" id="senha">
                <span id="erro-senha" class="login-span"> </span>

                <label class="login-label">Perfil: </label>
                <select class="login-select"> 
                    <option> Aluno </option>
                    <option> Professor </option>
                    <option> Administrador </option>
                </select>

                <input class="btn-entrar" type="submit" value="Entrar">

            </form>
            </div>
    </body>

</html>
